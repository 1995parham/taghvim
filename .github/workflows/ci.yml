name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATA_REPOSITORY: ${{ vars.DATA_REPOSITORY || '1995parham/taghvim-data' }}
  DATA_BRANCH: ${{ vars.DATA_BRANCH || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test
        run: node --test 'tests/*.test.mjs'

      - name: Get the latest data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPOSITORY }}
          ref: ${{ env.DATA_BRANCH }}
          path: data-repo

      - name: Validate the data
        working-directory: data-repo
        run: node scripts/validate.mjs

      - name: Build
        run: ./scripts/build.sh

      - name: Lint for Firefox
        run: npx --yes web-ext@8 lint --source-dir extension --self-hosted --warnings-as-errors

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taghvim
          path: dist/
