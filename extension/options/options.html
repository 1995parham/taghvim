<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Taghvim settings</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="128x128" href="../icons/icon-128.png">
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px/1.5 Vazirmatn, Tahoma, system-ui, sans-serif; margin: 16px; min-width: 360px; }
    label { display: block; margin-bottom: 10px; }
    label span { display: block; font-weight: 600; margin-bottom: 2px; }
    input, select { width: 100%; padding: 6px 8px; font: inherit; border: 1px solid #9aa0a6; border-radius: 6px; background: transparent; color: inherit; }
    .row { display: flex; gap: 8px; }
    .row label { flex: 1; }
    label.check { display: flex; align-items: center; gap: 6px; margin-top: 18px; }
    label.check input { width: auto; }
    label.check span { margin: 0; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    button { padding: 6px 14px; font: inherit; border-radius: 6px; border: 1px solid #9aa0a6; background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    #status { margin-top: 10px; min-height: 1.5em; word-break: break-word; }
    .ok { color: #188038; } .bad { color: #d93025; }
    .hint { color: #6b6b6b; font-size: 12px; }
  </style>
</head>
<body>
  <form id="form">
    <div class="row">
      <label><span>GitHub owner</span><input name="owner" required pattern="[A-Za-z0-9_.-]+"></label>
      <label><span>Repository</span><input name="repo" required pattern="[A-Za-z0-9_.-]+"></label>
    </div>
    <div class="row">
      <label><span>Branch</span><input name="branch" required></label>
      <label><span>Language / زبان</span>
        <select name="lang">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label><span>Search box / جستجو</span>
        <select name="search">
          <option value="google">Google</option>
          <option value="duckduckgo">DuckDuckGo</option>
          <option value="bing">Bing</option>
          <option value="none">Hide / پنهان</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" name="topSites"> <span>Most visited sites / سایت‌های پربازدید</span></label>
    </div>
    <p class="hint">The repository must be public. The extension reads <code>recurring.json</code>, <code>years/&lt;year&gt;.json</code>, and <code>images/</code> from it.</p>
    <div class="actions">
      <button class="primary" type="submit">Save</button>
      <button id="test" type="button">Test connection</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </form>
  <div id="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
